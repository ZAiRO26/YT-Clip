[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipforge-core"
version = "0.2.0"
description = "ClipForge AI shared core models, database, and pipeline services"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "yt-dlp>=2024.0.0",
    "faster-whisper>=1.0.0",
    "captacity>=0.1.0",
    "moviepy==1.0.3",
    "clipsai>=0.2.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "mediapipe>=0.10.0,<=0.10.14",
    "opencv-python>=4.8.0",
    "kokoro-onnx>=0.6.1",
    "soundfile>=0.12.0",
    "espeakng-loader>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["clipforge_core"]
